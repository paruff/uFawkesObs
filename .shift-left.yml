# Hooks that don't run in CI, and why (uFawkes.dev shift-left spec R3).
# uFawkesPipe's parity check (shift-left-parity) fails when a hook is neither
# run by CI nor listed here; Pre-flight passes local-only ids to pre-commit as SKIP.
local-only:
  - id: shift-left-reinstall
    reason: repairs this clone's installed git hooks after a checkout or merge; CI has no clone to repair
  - id: shift-left-stamp
    reason: records that hooks ran in this clone, for the doctor; CI's own run is the record there
  - id: shift-left-stamp-pre-push
    reason: as shift-left-stamp, for the pre-push stage
  - id: trivy
    reason: CI's Security Scanning job runs Trivy over the whole repo
ci-only: []
