# Pre-commit hooks for uFawkes product suite repos
# Install: make pre-commit-setup
# Run manually: pre-commit run --all-files

repos:
  # ============================================================================
  # General Code Quality
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        args: ["--allow-multiple-documents"]
      - id: check-json
        name: Check JSON syntax
      - id: check-added-large-files
        name: Check for large files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ["--fix=lf"]
      - id: detect-private-key
        name: Detect private keys

  # ============================================================================
  # Python Linting & Formatting
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19
    hooks:
      - id: ruff
        name: Lint Python with Ruff
        args: ["--fix"]
      - id: ruff-format
        name: Format Python with Ruff

  # ============================================================================
  # YAML Linting
  # ============================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: Lint YAML files
        args: ["-c", ".yamllint"]
        types: [yaml]

  # ============================================================================
  # Markdown Linting
  # ============================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ["--config", ".markdownlint.json", "--fix"]
        # release-please's fixed changelog template uses dash-style bullets
        # and double-blank-lines between sections -- permanently
        # incompatible with MD004 (this repo's hand-written entries are
        # asterisk-style) and MD012. Machine-generated, not hand-authored;
        # excluding rather than fighting a tool's fixed output format.
        exclude: ^CHANGELOG\.md$

  # ============================================================================
  # Shell Linting
  # ============================================================================
  # Local hook rather than the shellcheck-py mirror: CI's Pre-flight Checks
  # already runs the real shellcheck binary, and matching it exactly means a
  # clean commit locally is a clean Pre-flight. Requires shellcheck on PATH
  # (`brew install shellcheck` / `apt install shellcheck`).
  #
  # This exists because SC3040 was caught only in CI: `set -o pipefail` was
  # added to two #!/bin/sh scripts, which macOS /bin/sh (bash in POSIX mode)
  # accepts and dash -- /bin/sh on Debian, Ubuntu and the deploy host --
  # rejects outright, so the scripts would have died on every real run.
  - repo: local
    hooks:
      - id: shellcheck
        name: Lint shell scripts with shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        exclude: ^\.claude/worktrees/

  # ============================================================================
  # Security Scanning
  # ============================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: Detect secrets with Gitleaks

  # ============================================================================
  # Commit Message Validation
  # ============================================================================
  - repo: local
    hooks:
      - id: conventional-commit
        name: Validate Conventional Commits format
        entry: scripts/commit-msg.sh
        language: script
        stages: [commit-msg]
