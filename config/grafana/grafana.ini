# Grafana Configuration
# Reference: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
domain = localhost
root_url = http://localhost:3000/
serve_from_sub_path = false
router_logging = false

[database]
type = sqlite3
path = /var/lib/grafana/grafana.db
log_queries = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/application-performance.json

[security]
admin_user = ${GF_SECURITY_ADMIN_USER}
admin_password = ${GRAFANA_ADMIN_PASSWORD}
disable_initial_admin_creation = false

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info
format = json

[auth]
disable_login_form = false
disable_signout_menu = false

[auth.anonymous]
# Off by default (#380) — anyone who reaches this port previously read every
# dashboard (metrics, logs, traces) with zero credentials, independent of
# GRAFANA_ADMIN_PASSWORD. Override per-deployment with GF_AUTH_ANONYMOUS_ENABLED
# if a public read-only view is genuinely wanted; document that choice in
# docs/KNOWN_LIMITATIONS.md if you do.
enabled = false
org_name = Main Org.
org_role = Viewer

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer
