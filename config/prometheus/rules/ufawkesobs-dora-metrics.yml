# SPDX-License-Identifier: Apache-2.0
# DORA 2025/2026 Metrics Recording Rules
# Computed by dora-api's in-process compute loop (dora/compute/metrics.py) and
# scraped from dora-api:8088/metrics (job_name "dora-api") — the same source
# dora-overview.json's panels read directly. Consumed by the DORA dashboard
# and alerting.
#
# Previously computed from a separate, never-fed OTel-native pipeline
# (dora.deployment.* / dora.incident.* spans via otel-collector-dora) —
# nothing in this repo ever emitted those spans, so every rule here silently
# evaluated to an unlabeled `vector(0)` fallback forever. See issue #266.
# The otel-collector-dora *container* was removed (issue #266 follow-up): it
# received nothing, was scraped by nothing, and crash-looped on an
# unresolvable tempo:4317 (Tempo is in the core profile, it was in dora),
# spamming those errors into Loki via Alloy. config/otel/collector-dora.yaml
# is retained as inert config so the span-based path in ADR-006 can be
# rebuilt without redesigning it. These rules don't depend on either.
#
# Metric naming: Uses "dora:" namespace per ADR-006.
# Source metrics from dora-api's in-process compute (dora/compute/metrics.py),
# served as Prometheus gauges labeled by team_id/tier:
#   - dora_deployment_frequency_per_week
#   - dora_lead_time_p50_hours
#   - dora_cfr_pct       (0-1 ratio despite the name — see metrics.py:420)
#   - dora_fdrt_p50_hours
#   - dora_rework_rate_pct (0-1 ratio despite the name — see metrics.py:425)
#
# DORA 2025/2026 Five Key Metrics:
# 1. Deployment Frequency
# 2. Lead Time for Changes
# 3. Change Failure Rate
# 4. Failed Deployment Recovery Time (FDRT)
# 5. Rework Rate — user-visible rework events (hotfix, rollback or patch, matched to a
#    deployment by commit SHA) divided by total deployments, per
#    dora/compute/metrics_db_sqlite.py. dora.dev words the metric as the share of
#    deployments that are unplanned because of a production incident; this one is
#    narrower, because only events with user_visible=true count. It is not a
#    measure of reverted merges and not of AI output requiring rework.

groups:
  # DORA recording rules — two variants per metric (issue #533):
  #   * fallback rules (…or vector(0)): dashboards + threshold alerts read
  #     these so gaps never render as nulls. The vector(0) also means the
  #     series ALWAYS exists, so absent() on them can never fire and a
  #     zero reading can mean "no data" as easily as "zero".
  #   * raw rules (raw…): the same aggregation with NO fallback, so the
  #     series disappears when dora-api stops producing data. absent()
  #     guards and DORADeploymentFrequencyLow read these.
  - name: ufawkesobs_dora_metrics
    interval: 60s
    rules:
      # Deployment Frequency: org-wide deployments/week, summed across teams.
      # No team_id breakdown here (this dashboard has no team_id variable,
      # unlike dora-overview.json) — that's the intentional, original design.
      - record: dora:deployment_frequency:rate30d
        expr: |
          sum(dora_deployment_frequency_per_week)
          or vector(0)

      - record: dora:deployment_frequency:raw30d
        expr: |
          sum(dora_deployment_frequency_per_week)

      # Lead Time for Changes: org-wide average of each team's p50 lead time.
      - record: dora:lead_time_hours:p50_30d
        expr: |
          avg(dora_lead_time_p50_hours)
          or vector(0)

      - record: dora:lead_time_hours:raw_p50_30d
        expr: |
          avg(dora_lead_time_p50_hours)

      # Change Failure Rate: org-wide average CFR across teams (already a
      # 0-1 ratio in dora_cfr_pct, matching this rule's own "ratio30d" name
      # — do not multiply by 100 here, that's a display-time concern).
      - record: dora:change_failure_rate:ratio30d
        expr: |
          avg(dora_cfr_pct)
          or vector(0)

      - record: dora:change_failure_rate:raw_ratio30d
        expr: |
          avg(dora_cfr_pct)

      # Failed Deployment Recovery Time (FDRT): org-wide average of each
      # team's p50 recovery time.
      - record: dora:fdrt_hours:p50_30d
        expr: |
          avg(dora_fdrt_p50_hours)
          or vector(0)

      - record: dora:fdrt_hours:raw_p50_30d
        expr: |
          avg(dora_fdrt_p50_hours)

      # Rework Rate: org-wide average, sourced from dora-api's own
      # rework-rate computation (user-visible rework events matched to
      # deployments, not an AI-suggestion-acceptance proxy). Already a 0-1
      # ratio, matching this rule's "ratio" name.
      # Repo alert thresholds are used here, not the retired four-tier DORA
      # band model. The 2025 AI Capabilities Model watch/stop thresholds are
      # >10% and >20% respectively.
      - record: dora:rework_rate:ratio
        expr: |
          avg(dora_rework_rate_pct)
          or vector(0)

      - record: dora:rework_rate:raw_ratio
        expr: |
          avg(dora_rework_rate_pct)

  # DORA alerting rules
  # All alerts have category: dora label
  # All alerts have paired absent() guards
  - name: ufawkesobs_dora_alerts
    interval: 60s
    rules:
      # Deployment Frequency Low
      # Reads the RAW series: with the fallback rule a stack that never
      # produced DORA data evaluates as 0 and pages after 7d even though
      # nothing is wrong. Absent data is DORADeploymentFrequencyLowAbsent's
      # job, not this alert's (issue #533).
      - alert: DORADeploymentFrequencyLow
        expr: |
          dora:deployment_frequency:raw30d < 1
        for: 7d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Deployment frequency is below 1 per 30 days"
          description: |
            Deployment frequency has dropped below 1 deployment per 30 days.
            This may indicate stalled development or deployment pipeline issues.
            Only fires while DORA data is present; pipeline gaps raise
            DORADeploymentFrequencyLowAbsent instead.
            This repo tracks the value against the repository threshold, not
            the retired four-tier DORA bands.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#deployment-frequency-low"

      - alert: DORADeploymentFrequencyLowAbsent
        expr: |
          absent(dora:deployment_frequency:raw30d)
        for: 1d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Deployment frequency metrics are missing"
          description: |
            DORA deployment frequency data is absent — dora-api is down,
            unscraped, or has no teams/events yet. Check the dora profile
            and the CI/CD deploy-event flow.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#deployment-frequency-absent"

      # Lead Time High
      - alert: DORALeadTimeHigh
        expr: |
          dora:lead_time_hours:p50_30d > 24
        for: 7d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Lead time for changes exceeds 24 hours"
          description: |
            Median lead time from commit to production deployment exceeds 24 hours.
            This repo uses the repository alert threshold, not the retired
            four-tier DORA bands.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#lead-time-high"

      - alert: DORALeadTimeHighAbsent
        expr: |
          absent(dora:lead_time_hours:raw_p50_30d)
        for: 1d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Lead time metrics are missing"
          description: |
            Lead time data is absent — dora-api is down, unscraped, or has no
            deployment history yet. Check the dora profile and deploy-event flow.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#lead-time-absent"

      # Change Failure Rate High
      - alert: DORAChangeFailureRateHigh
        expr: |
          dora:change_failure_rate:ratio30d > 0.15
        for: 7d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Change failure rate exceeds 15%"
          description: |
            Change failure rate has exceeded 15% over the last 30 days.
            Review deployment quality and testing practices. This repo tracks
            the value against the repository alert threshold rather than the
            retired four-tier DORA bands.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#change-failure-rate-high"

      - alert: DORAChangeFailureRateCritical
        expr: |
          dora:change_failure_rate:ratio30d > 0.30
        for: 7d
        labels:
          severity: critical
          category: dora
        annotations:
          summary: "Change failure rate exceeds 30% — stop features"
          description: |
            Change failure rate has exceeded 30% over the last 30 days.
            Stop new features and fix deployment quality. Review AGENTS.md and
            the CI/CD pipeline for root causes.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#change-failure-rate-critical"

      - alert: DORAChangeFailureRateHighAbsent
        expr: |
          absent(dora:change_failure_rate:raw_ratio30d)
        for: 1d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Change failure rate metrics are missing"
          description: |
            Change failure rate data is absent — dora-api is down, unscraped,
            or no deployment outcomes have been recorded. Check the dora
            profile and the deploy-event flow.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#change-failure-rate-absent"

      # FDRT High
      - alert: DORAFDRTHigh
        expr: |
          dora:fdrt_hours:p50_30d > 4
        for: 7d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Failed deployment recovery time exceeds 4 hours"
          description: |
            Median time to restore service after incidents exceeds 4 hours.
            Review incident response procedures and on-call runbooks. This repo
            tracks the value against the repository alert threshold, not the
            retired four-tier DORA bands.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#fdrt-high"

      - alert: DORAFDRTHighAbsent
        expr: |
          absent(dora:fdrt_hours:raw_p50_30d)
        for: 1d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "FDRT metrics are missing"
          description: |
            Failed deployment recovery time data is absent — dora-api is down,
            unscraped, or no incident durations have been recorded. Check the
            dora profile and that incidents resolve with duration data.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#fdrt-absent"

      # Rework Rate High
      - alert: DORAReworkRateHigh
        expr: |
          dora:rework_rate:ratio > 0.10
        for: 7d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "AI rework rate exceeds 10% — watch threshold"
          description: |
            Rework rate has exceeded 10% over the last 30 days.
            The 2025 AI Capabilities Model watches this at >10%; rising rework
            above 10% signals AI instructions may need attention.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#rework-rate-high"

      - alert: DORAReworkRateCritical
        expr: |
          dora:rework_rate:ratio > 0.20
        for: 7d
        labels:
          severity: critical
          category: dora
        annotations:
          summary: "AI rework rate exceeds 20% — stop features, fix instructions"
          description: |
            Rework rate has exceeded 20% over the last 30 days.
            This exceeds the 2025 AI Capabilities Model stop-features threshold.
            Review AGENTS.md and PROMPT_LIBRARY.md before adding new features.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#rework-rate-critical"

      - alert: DORAReworkRateHighAbsent
        expr: |
          absent(dora:rework_rate:raw_ratio)
        for: 1d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Rework rate metrics are missing"
          description: |
            Rework rate data is absent — dora-api is down, unscraped, or the
            in-process rework computation has produced nothing yet. Check
            the dora profile and deploy/revert event flow.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#rework-rate-absent"
