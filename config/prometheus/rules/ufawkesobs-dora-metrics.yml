# DORA 2025/2026 Metrics Recording Rules
# Computed from dora-compute's Pushgateway output (dora-api -> dora-compute ->
# Pushgateway -> Prometheus), the same pipeline dora-overview.json's panels
# read directly. Consumed by the DORA dashboard and alerting.
#
# Previously computed from a separate, never-fed OTel-native pipeline
# (dora.deployment.* / dora.incident.* spans via otel-collector-dora) —
# nothing in this repo ever emitted those spans, so every rule here silently
# evaluated to an unlabeled `vector(0)` fallback forever. See issue #266.
# otel-collector-dora and its span-based config remain in place as dormant,
# harmless infrastructure for if that path is ever built for real — these
# rules just don't depend on it anymore.
#
# Metric naming: Uses "dora:" namespace per ADR-006.
# Source metrics from dora-compute (dora/compute/metrics.py), pushed as
# Pushgateway gauges labeled by team_id/tier:
#   - dora_deployment_frequency_per_week
#   - dora_lead_time_p50_hours
#   - dora_cfr_pct       (0-1 ratio despite the name — see metrics.py:420)
#   - dora_fdrt_p50_hours
#   - dora_rework_rate_pct (0-1 ratio despite the name — see metrics.py:425)
#
# DORA 2025/2026 Five Key Metrics:
# 1. Deployment Frequency
# 2. Lead Time for Changes
# 3. Change Failure Rate
# 4. Failed Deployment Recovery Time (FDRT)
# 5. Rework Rate — fraction of AI output requiring rework (DORA 2026)

groups:
  # DORA recording rules
  # All rules use or vector(0) to prevent absent() gaps
  - name: ufawkesobs_dora_metrics
    interval: 60s
    rules:
      # Deployment Frequency: org-wide deployments/week, summed across teams.
      # No team_id breakdown here (this dashboard has no team_id variable,
      # unlike dora-overview.json) — that's the intentional, original design.
      - record: dora:deployment_frequency:rate30d
        expr: |
          sum(dora_deployment_frequency_per_week)
          or vector(0)

      # Lead Time for Changes: org-wide average of each team's p50 lead time.
      - record: dora:lead_time_hours:p50_30d
        expr: |
          avg(dora_lead_time_p50_hours)
          or vector(0)

      # Change Failure Rate: org-wide average CFR across teams (already a
      # 0-1 ratio in dora_cfr_pct, matching this rule's own "ratio30d" name
      # — do not multiply by 100 here, that's a display-time concern).
      - record: dora:change_failure_rate:ratio30d
        expr: |
          avg(dora_cfr_pct)
          or vector(0)

      # Failed Deployment Recovery Time (FDRT): org-wide average of each
      # team's p50 recovery time.
      - record: dora:fdrt_hours:p50_30d
        expr: |
          avg(dora_fdrt_p50_hours)
          or vector(0)

      # Rework Rate: org-wide average, sourced from dora-compute's own
      # rework-rate computation (real merged-work-later-reverted data, not
      # an AI-suggestion-acceptance proxy). Already a 0-1 ratio, matching
      # this rule's "ratio" name.
      # DORA 2026 thresholds: Elite < 5%, High < 10%, Medium < 20%, Low >= 20%
      - record: dora:rework_rate:ratio
        expr: |
          avg(dora_rework_rate_pct)
          or vector(0)

  # DORA alerting rules
  # All alerts have category: dora label
  # All alerts have paired absent() guards
  - name: ufawkesobs_dora_alerts
    interval: 60s
    rules:
      # Deployment Frequency Low
      - alert: DORADeploymentFrequencyLow
        expr: |
          dora:deployment_frequency:rate30d < 1
        for: 7d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Deployment frequency is below 1 per 30 days"
          description: |
            Deployment frequency has dropped below 1 deployment per 30 days.
            This may indicate stalled development or deployment pipeline issues.
            DORA 2025: Elite > 1/day, High > 1/week, Medium > 1/month, Low < 1/month.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#deployment-frequency-low"

      - alert: DORADeploymentFrequencyLowAbsent
        expr: |
          absent(dora:deployment_frequency:rate30d)
        for: 7d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Deployment frequency metrics are missing"
          description: |
            DORA deployment frequency metric is absent. Deployment spans may not be flowing.
            Check CI/CD pipeline telemetry configuration.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#deployment-frequency-absent"

      # Lead Time High
      - alert: DORALeadTimeHigh
        expr: |
          dora:lead_time_hours:p50_30d > 24
        for: 7d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Lead time for changes exceeds 24 hours"
          description: |
            Median lead time from commit to production deployment exceeds 24 hours.
            DORA 2025: Elite < 1h, High < 1d, Medium < 1w, Low > 1w.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#lead-time-high"

      - alert: DORALeadTimeHighAbsent
        expr: |
          absent(dora:lead_time_hours:p50_30d)
        for: 7d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Lead time metrics are missing"
          description: |
            Lead time metric is absent. Deployment spans may not include lead_time_hours.
            Check CI/CD pipeline is emitting lead_time_hours attribute.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#lead-time-absent"

      # Change Failure Rate High
      - alert: DORAChangeFailureRateHigh
        expr: |
          dora:change_failure_rate:ratio30d > 0.15
        for: 7d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Change failure rate exceeds 15%"
          description: |
            Change failure rate has exceeded 15% over the last 30 days.
            DORA 2025: Elite < 5%, High < 15%, Medium < 30%, Low > 30%.
            Review deployment quality and testing practices.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#change-failure-rate-high"

      - alert: DORAChangeFailureRateCritical
        expr: |
          dora:change_failure_rate:ratio30d > 0.30
        for: 7d
        labels:
          severity: critical
          category: dora
        annotations:
          summary: "Change failure rate exceeds 30% — stop features"
          description: |
            Change failure rate has exceeded 30% over the last 30 days.
            DORA 2025: Low performance band. Stop new features, fix deployment quality.
            Review AGENTS.md and CI/CD pipeline for root causes.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#change-failure-rate-critical"

      - alert: DORAChangeFailureRateHighAbsent
        expr: |
          absent(dora:change_failure_rate:ratio30d)
        for: 7d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Change failure rate metrics are missing"
          description: |
            Change failure rate metric is absent. Deployment failure/success metrics may not be flowing.
            Check CI/CD pipeline is emitting deployment status.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#change-failure-rate-absent"

      # FDRT High
      - alert: DORAFDRTHigh
        expr: |
          dora:fdrt_hours:p50_30d > 4
        for: 7d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Failed deployment recovery time exceeds 4 hours"
          description: |
            Median time to restore service after incidents exceeds 4 hours.
            DORA 2025: Elite < 1h, High < 4h, Medium < 1d, Low > 1w.
            Review incident response procedures and on-call runbooks.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#fdrt-high"

      - alert: DORAFDRTHighAbsent
        expr: |
          absent(dora:fdrt_hours:p50_30d)
        for: 7d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "FDRT metrics are missing"
          description: |
            Failed deployment recovery time metric is absent. Incident duration
            metrics may not be flowing. Check Alertmanager alerts are firing
            and resolving with duration_hours attribute.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#fdrt-absent"

      # Rework Rate High
      - alert: DORAReworkRateHigh
        expr: |
          dora:rework_rate:ratio > 0.10
        for: 7d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "AI rework rate exceeds 10% — watch threshold"
          description: |
            Rework rate has exceeded 10% over the last 30 days.
            DORA 2026: Elite < 5%, High < 10%, Medium < 20%, Low >= 20%.
            Rising rework above 10% signals AI instructions may need attention.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#rework-rate-high"

      - alert: DORAReworkRateCritical
        expr: |
          dora:rework_rate:ratio > 0.20
        for: 7d
        labels:
          severity: critical
          category: dora
        annotations:
          summary: "AI rework rate exceeds 20% — stop features, fix instructions"
          description: |
            Rework rate has exceeded 20% over the last 30 days.
            DORA 2026: Low performance band. AI-generated code is creating more
            problems than it solves. Review AGENTS.md and PROMPT_LIBRARY.md
            before adding new features.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#rework-rate-critical"

      - alert: DORAReworkRateHighAbsent
        expr: |
          absent(dora:rework_rate:ratio)
        for: 7d
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "Rework rate metrics are missing"
          description: |
            AI rework rate metric is absent. AI SDK suggestion telemetry may not be
            flowing or ai-rules.yml recording rules may not be configured.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/dora.md#rework-rate-absent"
