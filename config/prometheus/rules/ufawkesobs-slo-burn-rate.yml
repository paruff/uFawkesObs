# SPDX-License-Identifier: Apache-2.0
# SLO burn-rate alerts and the CFR-regression rollback trigger (#502).
#
# SLI: scrape availability, i.e. the share of Prometheus targets that are up.
# SLO: 99.5% over 30d, so the error budget is 0.005.
# Multi-window, multi-burn-rate (Google SRE Workbook ch.5): a long window
# proves the burn is sustained, a short window proves it is still happening.
#   14.4x over 1h/5m  -> pages   (2% of the 30d budget in 1h)
#    6x   over 6h/30m -> pages   (5% of the budget in 6h)
#    3x   over 1d/2h  -> ticket  (10% of the budget in 1d)
# Thresholds are burn * 0.005: 0.072, 0.03, 0.015.
#
# Recording rules fall back to 0 when `up` has no data; the Absent companion
# alert covers that case so a missing signal is never read as "healthy".

groups:
  - name: ufawkesobs_slo_burn_rate_recording
    interval: 60s
    rules:
      - record: slo:scrape_error_ratio:5m
        expr: (1 - avg(avg_over_time(up[5m]))) or vector(0)
      - record: slo:scrape_error_ratio:30m
        expr: (1 - avg(avg_over_time(up[30m]))) or vector(0)
      - record: slo:scrape_error_ratio:1h
        expr: (1 - avg(avg_over_time(up[1h]))) or vector(0)
      - record: slo:scrape_error_ratio:2h
        expr: (1 - avg(avg_over_time(up[2h]))) or vector(0)
      - record: slo:scrape_error_ratio:6h
        expr: (1 - avg(avg_over_time(up[6h]))) or vector(0)
      - record: slo:scrape_error_ratio:1d
        expr: (1 - avg(avg_over_time(up[1d]))) or vector(0)

  - name: ufawkesobs_slo_burn_rate_alerts
    interval: 60s
    rules:
      - alert: SLOBurnRateFast
        expr: |
          slo:scrape_error_ratio:1h > 0.072 and slo:scrape_error_ratio:5m > 0.072
        for: 2m
        labels:
          severity: critical
          category: slo
        annotations:
          summary: "Scrape-availability SLO burning at >14.4x (1h/5m)"
          description: |
            Error ratio {{ $value | humanizePercentage }} against a 0.5% budget.
            At this rate 2% of the 30-day error budget is gone in an hour.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/slo-burn-rate.md#fast-burn"

      - alert: SLOBurnRateMedium
        expr: |
          slo:scrape_error_ratio:6h > 0.03 and slo:scrape_error_ratio:30m > 0.03
        for: 15m
        labels:
          severity: critical
          category: slo
        annotations:
          summary: "Scrape-availability SLO burning at >6x (6h/30m)"
          description: |
            Error ratio {{ $value | humanizePercentage }} against a 0.5% budget.
            At this rate 5% of the 30-day error budget is gone in six hours.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/slo-burn-rate.md#medium-burn"

      - alert: SLOBurnRateSlow
        expr: |
          slo:scrape_error_ratio:1d > 0.015 and slo:scrape_error_ratio:2h > 0.015
        for: 1h
        labels:
          severity: warning
          category: slo
        annotations:
          summary: "Scrape-availability SLO burning at >3x (1d/2h)"
          description: |
            Error ratio {{ $value | humanizePercentage }} against a 0.5% budget.
            At this rate 10% of the 30-day error budget is gone in a day.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/slo-burn-rate.md#slow-burn"

      - alert: SLOBurnRateAbsent
        expr: absent(up)
        for: 5m
        labels:
          severity: warning
          category: slo
        annotations:
          summary: "No `up` series — burn-rate alerts cannot evaluate"
          description: Prometheus has no scrape targets; the SLO is unmeasured.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/slo-burn-rate.md#absent"

  - name: ufawkesobs_cfr_rollback
    interval: 60s
    rules:
      # dora_cfr_pct is a 0-1 ratio despite the name (see
      # ufawkesobs-dora-metrics.yml). Fires only when CFR is both high in
      # absolute terms (>30%) and 10 points above the 30-day baseline, so a
      # team that is always noisy does not trigger rollbacks. The `action`
      # label routes this to the cfr-rollback receiver in alertmanager.yml;
      # .github/workflows/cfr-rollback.yml acts on it.
      - alert: DORACFRRegressionRollback
        expr: |
          dora_cfr_pct > 0.30
          and
          dora_cfr_pct > (avg_over_time(dora_cfr_pct[30d]) + 0.10)
        for: 15m
        labels:
          severity: critical
          category: dora
          action: rollback
        annotations:
          summary: "Change Failure Rate regressed — automated rollback requested"
          description: |
            {{ $labels.team_id }} CFR at {{ $value | humanizePercentage }},
            more than 10 points above its 30-day average. Rolls the host back
            to deploy-latest-good when CFR_AUTO_ROLLBACK_ENABLED is "true".
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/slo-burn-rate.md#cfr-rollback"

      - alert: DORACFRRegressionRollbackAbsent
        expr: absent(dora_cfr_pct)
        for: 1h
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "CFR metric missing — rollback trigger cannot evaluate"
          description: |
            dora_cfr_pct is absent; check up{job="dora-api"} and its logs.
          runbook_url: "https://github.com/paruff/uFawkesObs/blob/main/docs/runbooks/slo-burn-rate.md#cfr-rollback-absent"
