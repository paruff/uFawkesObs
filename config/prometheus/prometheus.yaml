---
# LB-04 (#182) connectivity probe: trivial comment-only change to trigger
# deploy.yml's config-reload path and confirm the SSH connection to
# DEPLOY_HOST actually works before running the real rollback drill.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "development"
    cluster: "local"

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s
      api_version: v2

# Rule files
rule_files:
  - "/etc/prometheus/alerts.yml"
  - "/etc/prometheus/rules/ufawkesobs-self-monitoring.yml"
  - "/etc/prometheus/rules/ai-rules.yml"
  - "/etc/prometheus/rules/ufawkesobs-dora-metrics.yml"
  - "/etc/prometheus/rules/ufawkesobs-dora-regression.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          plane: "obstackd"
          component: "prometheus"
    scrape_interval: 30s

  # OpenTelemetry Collector (internal metrics)
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          plane: "obstackd"
          component: "otel-collector"
          service: "telemetry"
    scrape_interval: 15s
    metrics_path: "/metrics"
    scheme: "http"

    # Relabeling for better metric organization
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(?::\d+)?'
        replacement: "${1}"

    # Optional: metric relabeling to clean up metric names
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "otelcol_(.*)"
        target_label: otel_component
        replacement: "${1}"

    # Scrape timeout and retry settings
    scrape_timeout: 10s
    honor_labels: true

  # OpenTelemetry Collector (application metrics from Prometheus exporter)
  - job_name: "otel-app-metrics"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          plane: "obstackd"
          component: "otel-collector"
          service: "application-metrics"
    scrape_interval: 15s
    metrics_path: "/metrics"
    scheme: "http"
    scrape_timeout: 10s
    honor_labels: true

  # Alertmanager
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          plane: "obstackd"
          component: "alertmanager"
          service: "alerting"
    scrape_interval: 30s
    metrics_path: "/metrics"
    scheme: "http"

  # Alloy
  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          plane: "obstackd"
          component: "alloy"
    scrape_interval: 15s
    metrics_path: "/metrics"
    scheme: "http"

  # Loki
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
        labels:
          plane: "obstackd"
          component: "loki"
          service: "logging"
    scrape_interval: 15s
    metrics_path: "/metrics"
    scheme: "http"

  # Tempo
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          plane: "obstackd"
          component: "tempo"
          service: "tracing"
    scrape_interval: 15s
    metrics_path: "/metrics"
    scheme: "http"

  # Grafana
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          plane: "obstackd"
          component: "grafana"
    scrape_interval: 30s
    metrics_path: "/metrics"
    scheme: "http"

  # Node Exporter
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          plane: "obstackd"
          component: "node-exporter"
    scrape_interval: 15s
    metrics_path: "/metrics"

  # dora-api — scraped directly for computed DORA metrics (dora profile only).
  #
  # Replaces the Pushgateway job: dora-compute was a long-running service, and
  # Pushgateway is documented for ephemeral batch jobs. Pushing cost the `up`
  # liveness signal for the metrics producer and left series alive after their
  # producer stopped — stale test jobs were still being served long after.
  #
  # No honor_labels here, deliberately. It existed to preserve the
  # job="ufawkesdora_<team>" label dora-compute pushed, which duplicated the
  # team_id label already on every sample. Nothing — no recording rule, no
  # dashboard — referenced that job label, so dropping it changes no query.
  - job_name: "dora-api"
    static_configs:
      - targets: ["dora-api:8088"]
        labels:
          plane: "obstackd"
          component: "dora-api"
    scrape_interval: 15s
    metrics_path: "/metrics"
    scheme: "http"
