---
# Alertmanager Configuration
# https://prometheus.io/docs/alerting/latest/configuration/

global:
  resolve_timeout: 5m
  # SMTP settings (disabled by default, configure for email notifications)
  # smtp_smarthost: 'localhost:25'
  # smtp_from: 'alertmanager@example.com'
  # smtp_auth_username: ''
  # smtp_auth_password: ''
  # smtp_require_tls: false

# Templates for notification messages
templates:
  - "/etc/alertmanager/templates/*.tmpl"

# Route defines the routing tree and notification destinations
route:
  # Default receiver for all alerts
  receiver: "default-webhook"

  # Group alerts by these labels
  group_by: ["alertname", "cluster", "service"]

  # How long to wait before sending initial notification for a group
  group_wait: 30s

  # How long to wait before sending notification about new alerts added to group
  group_interval: 5m

  # How long to wait before re-sending a notification
  repeat_interval: 4h

  # Child routes for specific alert routing
  routes:
    # uFawkesObs platform health alerts - dedicated receiver
    - match:
        alert_domain: ufawkesobs-health
      receiver: "ufawkesobs-health"
      group_wait: 15s
      repeat_interval: 1h
      continue: false

    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: "critical-alerts"
      group_wait: 10s
      repeat_interval: 1h
      continue: false

    # Warning alerts - standard notification
    - match:
        severity: warning
      receiver: "warning-alerts"
      group_wait: 30s
      repeat_interval: 4h
      continue: false

    # Info alerts - batched notification
    - match:
        severity: info
      receiver: "info-alerts"
      group_wait: 5m
      repeat_interval: 12h
      continue: false

    # DORA regression/leading indicator alerts - dedicated Slack route
    - match:
        category: dora
      receiver: "dora-slack"
      group_wait: 30s
      repeat_interval: 1h
      continue: false

    # ── [RECIPE] Notification channel catch-alls ─────────────────────────────
    # Uncomment to send every alert that isn't matched above to Slack and/or
    # Discord. Wire these together with the `slack-notifications` and
    # `discord-notifications` receivers below (also commented out).
    # See docs/alertmanager-operations.md → "Slack Notifications" /
    # "Discord Notifications" for the full tested walkthrough.
    #
    # - receiver: "slack-notifications"
    #   continue: false
    # - receiver: "discord-notifications"
    #   continue: false

# Inhibition rules - suppress notifications for certain alerts
inhibit_rules:
  # Inhibit warning and info if same alertname with critical severity exists
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "cluster", "service"]

  - source_match:
      severity: "critical"
    target_match:
      severity: "info"
    equal: ["alertname", "cluster", "service"]

  # Inhibit info if same alertname with warning severity exists
  - source_match:
      severity: "warning"
    target_match:
      severity: "info"
    equal: ["alertname", "cluster", "service"]

# Receivers define notification destinations
receivers:
  # Default webhook receiver for testing
  - name: "default-webhook"
    webhook_configs:
      - url: "http://host.docker.internal:5001/webhook"
        send_resolved: true
        max_alerts: 0

  # Critical alerts receiver
  - name: "critical-alerts"
    webhook_configs:
      - url: "http://host.docker.internal:5001/webhook/critical"
        send_resolved: true
        max_alerts: 0
    # Uncomment for Slack integration (add under critical-alerts):
    #   Requires SLACK_WEBHOOK_URL in .env — never hardcode a webhook URL.
    #   slack_configs:
    #     - api_url: "${SLACK_WEBHOOK_URL}"
    #       channel: "#alerts-critical"
    #       title: '{{ .GroupLabels.alertname }}'
    #       text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    #       send_resolved: true

  # Warning alerts receiver
  - name: "warning-alerts"
    webhook_configs:
      - url: "http://host.docker.internal:5001/webhook/warning"
        send_resolved: true
        max_alerts: 0
    # Uncomment for email notifications (add under warning-alerts):
    # email_configs:
    #   - to: 'team@example.com'
    #     headers:
    #       Subject: 'Warning Alert: {{ .GroupLabels.alertname }}'
    #     send_resolved: true

  # Info alerts receiver
  - name: "info-alerts"
    webhook_configs:
      - url: "http://host.docker.internal:5001/webhook/info"
        send_resolved: true
        max_alerts: 0

  # uFawkesObs platform health receiver
  - name: "ufawkesobs-health"
    webhook_configs:
      # Dedicated host webhook sink for platform self-monitoring alerts.
      - url: "http://host.docker.internal:5001/webhook/ufawkesobs-health"
        send_resolved: true
        max_alerts: 0

  # DORA regression/leading indicator alerts - Slack webhook
  - name: "dora-slack"
    webhook_configs:
      - url: "http://host.docker.internal:5001/webhook/dora"
        send_resolved: true
        max_alerts: 0
    # Uncomment for Slack integration (uses the same SLACK_WEBHOOK_URL as the
    # recipe below — no hardcoded secret):
    # slack_configs:
    #   - api_url: ${SLACK_WEBHOOK_URL}
    #     channel: '#dora-alerts'
    #     title: '{{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    #     send_resolved: true

  # ── [RECIPE] Slack notifications — TESTED ─────────────────────────────────
  # Send every alert to a Slack channel via a Slack incoming webhook.
  #
  # Enable in 3 steps:
  #   1. Create an incoming webhook for your Slack workspace/channel and set it
  #      in .env:  SLACK_WEBHOOK_URL=https://hooks.slack.com/services/T0000000/B0000000/XXXX
  #   2. Uncomment this receiver AND its catch-all route in `route:` above.
  #   3. Reload Alertmanager:  curl -X POST http://localhost:9093/-/reload
  #
  # Walkthrough with a live test: docs/alertmanager-operations.md
  # - name: "slack-notifications"
  #   slack_configs:
  #     - api_url: "${SLACK_WEBHOOK_URL}"
  #       channel: "#alerts"
  #       title: '{{ .GroupLabels.alertname }}'
  #       text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
  #       send_resolved: true
  #       icon_emoji: ":rotating_light:"

  # ── [RECIPE] Discord notifications — TESTED ───────────────────────────────
  # Alertmanager has no native Discord integration. This receiver posts to the
  # `alertmanager-discord` bridge container (compose service, `notifications`
  # profile) which translates Alertmanager webhooks into Discord embeds.
  #
  # Enable in 4 steps:
  #   1. Create a Discord channel webhook (Channel Settings → Integrations →
  #      Webhooks) and set it in .env:
  #      DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/<ID>/<TOKEN>
  #   2. Start the bridge:  docker compose --profile core --profile notifications up -d
  #   3. Uncomment this receiver AND its catch-all route in `route:` above.
  #   4. Reload Alertmanager:  curl -X POST http://localhost:9093/-/reload
  #
  # Walkthrough with a live test: docs/alertmanager-operations.md
  # - name: "discord-notifications"
  #   webhook_configs:
  #     - url: "http://alertmanager-discord:9094"
  #       send_resolved: true
  #       max_alerts: 0
