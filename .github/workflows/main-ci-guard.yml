name: Main CI Guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  check-main-ci:
    name: "🛡️ Main CI Health"
    uses: paruff/ufawkespipe/.github/workflows/reusable-main-ci-guard.yml@7167fbcaaaefd8724f55eeb4ce2110e986dab203 # v1.2.1
    with:
      workflow-id: ci-pipeline.yml
      workflow-name: "Pre-Merge Pipeline"

  check-acceptance-full:
    name: "🛡️ Acceptance Full Health"
    uses: paruff/ufawkespipe/.github/workflows/reusable-main-ci-guard.yml@7167fbcaaaefd8724f55eeb4ce2110e986dab203 # v1.2.1
    with:
      workflow-id: ci-acceptance-full.yml
      workflow-name: "Acceptance Full (Post-Merge)"
