name: Unit & Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Compose's `secrets: slack_webhook_url: environment:` source requires this
  # var to exist (even empty) or `docker compose up` refuses to start ANY
  # service under core, not just alertmanager. Empty is fine — the Slack
  # receiver that reads the secret stays commented out by default (see
  # config/alertmanager/alertmanager.yml, LB-03/#181).
  SLACK_WEBHOOK_URL: ""

jobs:
  # ─── Unit Tests ───────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/unit/requirements.lock

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-results
          path: tests/unit/reports/
          if-no-files-found: ignore

  # ─── Integration Tests ───────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GRAFANA_ADMIN_USER: admin
      # Ephemeral CI-only stack, torn down at job end — not a real credential,
      # so a plain value here (not a GitHub secret) is fine. Required since
      # compose.yaml stopped defaulting this to "admin" (#380/PR #386); this
      # job never set it at all before, unlike the other CI workflows.
      # Every integration file self-provisions its own stack (#416) and reads
      # this GRAFANA_ADMIN_PASSWORD directly; there is no shared stack.
      GRAFANA_ADMIN_PASSWORD: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.7"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/integration/requirements.lock

      - name: Run OTel Collector tests
        # Migrated to Testcontainers (#413/#416) -- self-provisions,
        # doesn't read OTEL_METRICS_URL. The original test_otel_collector.py
        # is retired; this file now covers everything it did.
        run: pytest tests/integration/test_otel_collector_testcontainers.py -v --tb=short

      - name: Run Tempo integration tests
        # Migrated to Testcontainers (#416) -- self-provisions its own Tempo
        # container via the docker socket, doesn't read TEMPO_URL.
        run: pytest tests/integration/test_tempo_integration.py -v --tb=short

      - name: Run Loki integration tests
        # Migrated to Testcontainers (#416) -- self-provisions, doesn't
        # read LOKI_URL.
        run: pytest tests/integration/test_loki_integration.py -v --tb=short

      - name: Run Alloy and dashboard data-flow tests
        # Migrated to Testcontainers (#416) -- self-provisions the whole
        # `core` profile (Alloy needs Loki + Prometheus), doesn't read
        # ALLOY_URL/LOKI_URL/TEMPO_URL/PROMETHEUS_URL/GRAFANA_URL.
        run: pytest tests/integration/test_alloy_and_dashboards.py -v --tb=short

      - name: Run dashboard tests
        # Migrated to Testcontainers (#416) -- self-provisions Grafana +
        # Prometheus + Tempo + Loki, doesn't read GRAFANA_URL/USER/PASSWORD.
        run: pytest tests/integration/test_dashboards.py -v --tb=short

      - name: Run Grafana integration tests
        # Migrated to Testcontainers (#416) -- self-provisions Grafana +
        # Prometheus + Tempo + Loki together (Grafana's datasource
        # provisioning needs them by Docker Compose service name),
        # doesn't read GRAFANA_URL/GRAFANA_USER/GRAFANA_PASSWORD.
        run: pytest tests/integration/test_grafana_integration.py -v --tb=short

      - name: Run Prometheus scraping tests
        # Migrated to Testcontainers (#416) -- self-provisions the whole
        # `core` profile (test_all_configured_targets_are_up needs every
        # scrape target up), doesn't read PROMETHEUS_URL.
        run: pytest tests/integration/test_prometheus_scraping.py -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-results
          path: |
            tests/integration/reports/
            pytest-report.xml
          if-no-files-found: ignore

  # ─── Conformance Tests (InSpec) ──────────────────────────────────────────
  # AGENTS.md §4: checks the actually-running containers against declared
  # compose.yaml (healthcheck status, image digest, port bindings, no
  # anonymous volumes) via inspec/ufawkesobs-conformance (#414). Not yet a
  # required branch-protection check (#415) -- runs and reports on every PR
  # so its false-positive rate can be observed before gating merges on it.
  conformance-tests:
    name: Conformance Tests (InSpec)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GRAFANA_ADMIN_USER: admin
      GRAFANA_ADMIN_PASSWORD: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create data directories
        run: |
          mkdir -p data/prometheus data/grafana data/tempo data/loki data/alertmanager data/alloy
          chmod -R 777 data/

      - name: Start observability stack
        run: docker compose --profile core up -d --build

      - name: Wait for services
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:9090/-/ready; do sleep 2; done'
          timeout 90 bash -c 'until curl -sf http://localhost:3000/api/health; do sleep 2; done'
          timeout 90 bash -c 'until curl -sf http://localhost:3200/ready; do sleep 2; done'
          timeout 90 bash -c 'until curl -sf http://localhost:3100/ready; do sleep 2; done'
          timeout 90 bash -c 'until curl -sf http://localhost:8888/metrics; do sleep 2; done'
          sleep 20

      - name: Run InSpec conformance profile
        run: make test-conformance

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=50 prometheus grafana otel-collector tempo loki alloy

      - name: Shutdown
        if: always()
        run: docker compose --profile core down -v

  # ─── Golden Path App ─────────────────────────────────────────────────────
  apps-test:
    name: Golden Path App
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for app services
        id: check_apps
        run: |
          if grep -q '"8080:8080"' compose.yaml; then
            echo "has_apps=true" >> $GITHUB_OUTPUT
          else
            echo "has_apps=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and start full stack
        if: steps.check_apps.outputs.has_apps == 'true'
        run: |
          mkdir -p data/prometheus data/grafana
          chmod -R 777 data/
          docker compose --profile core --profile apps up -d --build

      - name: Wait for app to be ready
        if: steps.check_apps.outputs.has_apps == 'true'
        run: timeout 30 bash -c 'until curl -sf http://localhost:8080/ > /dev/null; do sleep 2; done'

      - name: Hit endpoints
        if: steps.check_apps.outputs.has_apps == 'true'
        run: |
          curl -f http://localhost:8080/
          curl -f http://localhost:8080/slow
          # /error returns 5xx on purpose, to generate error traffic: without -f
          # curl exits 0 on an HTTP error and non-zero only if the app is unreachable.
          curl -s -o /dev/null http://localhost:8080/error

      - name: Shutdown
        if: always() && steps.check_apps.outputs.has_apps == 'true'
        run: docker compose down -v

      - name: Skip
        if: steps.check_apps.outputs.has_apps == 'false'
        run: echo "No demo app services (port 8080) found. Skipping."
