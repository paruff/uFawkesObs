name: Quality & Security Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0" # weekly security scan
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── Security ─────────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # ─── Supply Chain ─────────────────────────────────────────────────────────
  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail if ':latest' is used
        run: |
          if grep -R "image: .*:latest" -n compose.yaml; then
            echo "::error::Do not use :latest tags in compose.yaml"
            exit 1
          fi

  # ─── Config Validation ───────────────────────────────────────────────────
  validate-config:
    name: Validate Configs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve validator images from compose.yaml
        run: |
          set -euo pipefail
          compose_json="$(docker compose --env-file .env.example --profile '*' config --format json)"
          prometheus_image="$(jq -r '.services.prometheus.image' <<<"$compose_json")"
          otel_image="$(jq -r '.services["otel-collector"].image' <<<"$compose_json")"
          tempo_image="$(jq -r '.services.tempo.image' <<<"$compose_json")"

          require_resolved_image() {
            key="$1"
            value="$2"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::Failed to resolve $key from compose.yaml"
              exit 1
            fi
          }

          require_resolved_image "PROMETHEUS_IMAGE" "$prometheus_image"
          require_resolved_image "OTEL_IMAGE" "$otel_image"
          require_resolved_image "TEMPO_IMAGE" "$tempo_image"

          {
            echo "PROMETHEUS_IMAGE=$prometheus_image"
            echo "OTEL_IMAGE=$otel_image"
            echo "TEMPO_IMAGE=$tempo_image"
          } >> "$GITHUB_ENV"

      - name: Validate Prometheus config
        if: hashFiles('config/prometheus/prometheus.yaml') != ''
        run: |
          docker run --rm \
            -v $PWD/config/prometheus:/etc/prometheus \
            --entrypoint promtool \
            "$PROMETHEUS_IMAGE" \
            check config /etc/prometheus/prometheus.yaml

      - name: Validate OTel config
        if: hashFiles('config/otel/collector.yaml') != ''
        run: |
          docker run --rm \
            -v $PWD/config/otel/collector.yaml:/etc/otel/config.yaml \
            "$OTEL_IMAGE" \
            validate --config=/etc/otel/config.yaml

      - name: Validate Tempo config
        if: hashFiles('config/tempo/tempo.yaml') != ''
        run: |
          docker run --rm \
            -v $PWD/config/tempo/tempo.yaml:/etc/tempo.yaml \
            "$TEMPO_IMAGE" \
            -config.file=/etc/tempo.yaml -config.verify=true

      - name: Install yq
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64
          echo "c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385  yq" | sha256sum --check --quiet -
          chmod +x yq
          sudo install -m 0755 yq /usr/local/bin/yq

      - name: Validate Alertmanager config
        run: make validate-alertmanager

      - name: Validate Alloy config
        run: make validate-alloy

  # ─── Lint (actionlint, hadolint) ─────────────────────────────────────────
  # Versions and sha256s match .devcontainer/install-tools.sh (#467).
  lint:
    name: Lint Workflows & Dockerfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint and hadolint
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum --check --quiet -
          tar -xzf actionlint.tgz actionlint
          curl -fsSL --retry 3 -o hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  hadolint" | sha256sum --check --quiet -
          chmod +x hadolint
          mkdir -p "$HOME/.local/bin"
          mv actionlint hadolint "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: make lint-workflows

      - name: Lint Dockerfiles
        run: make lint-dockerfiles

  # ─── Image scan (trivy) ──────────────────────────────────────────────────
  scan-images:
    name: Scan Compose Images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install trivy
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o trivy.tgz \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  trivy.tgz" | sha256sum --check --quiet -
          tar -xzf trivy.tgz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Scan images (fail on fixable CRITICAL)
        run: |
          set -euo pipefail
          docker compose --env-file .env.example --profile '*' config --images | grep / | sort -u | \
            while read -r img; do
              echo "── $img"
              trivy image --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 "$img"
            done

  # ─── PR Size Gate ────────────────────────────────────────────────────────
  pr-size:
    name: PR Size
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 2
    steps:
      - name: Check PR size
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const total = pr.additions + pr.deletions;
            const limit = 400;
            const hasOverride = pr.labels.some(l => l.name === 'large-pr-approved');
            console.log(`PR #${pr.number}: +${pr.additions} -${pr.deletions} = ${total} lines`);
            if (hasOverride) {
              console.log('✅ large-pr-approved override accepted');
              return;
            }
            if (total > limit) {
              core.setFailed(
                `❌ PR size: ${total} lines (limit: ${limit})\n` +
                `Split into smaller PRs or get large-pr-approved label from a human.`
              );
            } else {
              console.log(`✅ PR size: ${total} lines — within limit`);
            }
