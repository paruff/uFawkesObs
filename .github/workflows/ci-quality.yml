name: Quality & Security Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0" # weekly security scan
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── Security ─────────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # ─── Supply Chain ─────────────────────────────────────────────────────────
  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Fail if ':latest' is used
        run: |
          if grep -R "image: .*:latest" -n compose.yaml; then
            echo "::error::Do not use :latest tags in compose.yaml"
            exit 1
          fi

  # ─── Config Validation ───────────────────────────────────────────────────
  validate-config:
    name: Validate Configs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve validator images from compose.yaml
        run: |
          set -euo pipefail
          compose_json="$(docker compose config --format json)"
          prometheus_image="$(jq -r '.services.prometheus.image' <<<"$compose_json")"
          otel_image="$(jq -r '.services["otel-collector"].image' <<<"$compose_json")"
          tempo_image="$(jq -r '.services.tempo.image' <<<"$compose_json")"

          require_resolved_image() {
            key="$1"
            value="$2"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::Failed to resolve $key from compose.yaml"
              exit 1
            fi
          }

          require_resolved_image "PROMETHEUS_IMAGE" "$prometheus_image"
          require_resolved_image "OTEL_IMAGE" "$otel_image"
          require_resolved_image "TEMPO_IMAGE" "$tempo_image"

          {
            echo "PROMETHEUS_IMAGE=$prometheus_image"
            echo "OTEL_IMAGE=$otel_image"
            echo "TEMPO_IMAGE=$tempo_image"
          } >> "$GITHUB_ENV"

      - name: Validate Prometheus config
        if: hashFiles('config/prometheus/prometheus.yaml') != ''
        run: |
          docker run --rm \
            -v $PWD/config/prometheus:/etc/prometheus \
            --entrypoint promtool \
            "$PROMETHEUS_IMAGE" \
            check config /etc/prometheus/prometheus.yaml

      - name: Validate OTel config
        if: hashFiles('config/otel/collector.yaml') != ''
        run: |
          docker run --rm \
            -v $PWD/config/otel/collector.yaml:/etc/otel/config.yaml \
            "$OTEL_IMAGE" \
            validate --config=/etc/otel/config.yaml

      - name: Validate Tempo config
        if: hashFiles('config/tempo/tempo.yaml') != ''
        run: |
          docker run --rm \
            -v $PWD/config/tempo/tempo.yaml:/etc/tempo.yaml \
            "$TEMPO_IMAGE" \
            -config.file=/etc/tempo.yaml -config.verify=true

  # ─── PR Size Gate ────────────────────────────────────────────────────────
  pr-size:
    name: PR Size
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 2
    steps:
      - name: Check PR size
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const total = pr.additions + pr.deletions;
            const limit = 400;
            const hasOverride = pr.labels.some(l => l.name === 'large-pr-approved');
            console.log(`PR #${pr.number}: +${pr.additions} -${pr.deletions} = ${total} lines`);
            if (hasOverride) {
              console.log('✅ large-pr-approved override accepted');
              return;
            }
            if (total > limit) {
              core.setFailed(
                `❌ PR size: ${total} lines (limit: ${limit})\n` +
                `Split into smaller PRs or get large-pr-approved label from a human.`
              );
            } else {
              console.log(`✅ PR size: ${total} lines — within limit`);
            }
