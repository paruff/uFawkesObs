name: GitOps Reconciliation Deploy

# Deploy is acceptance-gated only (LB-05, #183): every merge to main runs
# "Acceptance Full (Post-Merge)", and this workflow reconciles once that
# workflow completes. The previous `push` trigger was removed — 100% of its
# runs failed with empty deploy secrets, so it only produced red runs while a
# redundant acceptance-gated run did the real deploy.
on:
  workflow_run:
    workflows: ["Acceptance Full (Post-Merge)"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: gitops-reconciliation-${{ github.ref }}
  cancel-in-progress: true

# Deploy only when the triggering acceptance-full workflow passed
jobs:
  # ─── Tag Deploy Candidate ──────────────────────────────────────────────────
  # Deploy targets an immutable tag, not main's moving HEAD (LB-04 redesign,
  # #182). Rollback checks out deploy-latest-good instead of reverting +
  # pushing to main, so neither deploy nor rollback ever pushes to main —
  # branch protection on main no longer affects this pipeline at all.
  tag-candidate:
    name: Tag deploy candidate
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: "job-start"
        run: 'echo "job-start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create and push candidate tag
        id: tag
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          tag="deploy-$(date -u +%Y%m%d-%H%M%S)-${sha:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Deploy candidate ${sha}"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: "job-finish"
        if: always()
        run: 'echo "job-finish: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      compose_changed: ${{ steps.filter.outputs.compose }}
      reload_changed: ${{ steps.filter.outputs.reload }}
      non_reloadable_config_changed: ${{ steps.filter.outputs.non_reloadable_config }}
    steps:
      - name: "job-start"
        run: 'echo "job-start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            compose:
              - 'compose.yaml'
            reload:
              - 'config/prometheus/**'
              - 'config/alloy/**'
              - '.env.example'
              - 'dashboards/**'
            non_reloadable_config:
              - 'config/**'
              - '!config/prometheus/**'
              - '!config/alloy/**'

      - name: "job-finish"
        if: always()
        run: 'echo "job-finish: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'

  deploy-config-reload:
    name: Deploy (config reload)
    needs: [detect-changes, tag-candidate]
    # Ensure the triggering acceptance-full workflow passed
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      needs.detect-changes.outputs.reload_changed == 'true' &&
      needs.detect-changes.outputs.compose_changed != 'true' &&
      needs.detect-changes.outputs.non_reloadable_config_changed != 'true'
    runs-on: ubuntu-latest
    outputs:
      deployment_mode: ${{ steps.summary.outputs.deployment_mode }}
      services_action: ${{ steps.summary.outputs.services_action }}
      health_result: ${{ steps.summary.outputs.health_result }}
    steps:
      - name: "job-start"
        run: 'echo "job-start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'

      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "::error::Missing required secret: DEPLOY_HOST"
            missing=1
          fi
          if [ -z "${DEPLOY_USER}" ]; then
            echo "::error::Missing required secret: DEPLOY_USER"
            missing=1
          fi
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::Missing required secret: DEPLOY_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add deploy host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "${DEPLOY_HOST_KEY}" ]; then
            printf '%s\n' "${DEPLOY_HOST_KEY}" >> ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_HOST_KEY not set; using ssh-keyscan TOFU fallback for ${DEPLOY_HOST}"
            ssh-keyscan -T 10 -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          fi

      - name: Reload services on target host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_TAG: ${{ needs.tag-candidate.outputs.tag }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          case "${REPO_NAME}" in
            ""|.*|*..*|*.|*[!A-Za-z0-9._-]*)
              echo "::error::Unsafe repository name for remote path: ${REPO_NAME}"
              exit 1
              ;;
          esac
          if [ -n "${DEPLOY_PATH}" ]; then
            case "${DEPLOY_PATH}" in
              /*) ;;
              *)
                echo "::error::DEPLOY_PATH must be an absolute path: ${DEPLOY_PATH}"
                exit 1
                ;;
            esac
            case "${DEPLOY_PATH}" in
              *"'"*|*..*|*[!A-Za-z0-9_./-]*)
                echo "::error::Unsafe DEPLOY_PATH value: ${DEPLOY_PATH}"
                exit 1
                ;;
            esac
          fi
          case "${DEPLOY_TAG}" in
            deploy-????????-??????-*) ;;
            *)
              echo "::error::Unexpected DEPLOY_TAG format: ${DEPLOY_TAG}"
              exit 1
              ;;
          esac
          ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "REPO_NAME='${REPO_NAME}' DEPLOY_PATH='${DEPLOY_PATH}' DEPLOY_TAG='${DEPLOY_TAG}' bash -s" <<'REMOTE'
          set -euo pipefail

          REPO_DIR="${DEPLOY_PATH:-$HOME/${REPO_NAME}}"
          case "${REPO_DIR}" in
            ""|*..*)
              echo "Unsafe repository path: ${REPO_DIR}"
              exit 1
              ;;
          esac
          if [[ "${REPO_DIR}" != /* ]]; then
            echo "Repository path must be absolute: ${REPO_DIR}"
            exit 1
          fi

          if [ ! -d "${REPO_DIR}/.git" ]; then
            echo "Repository not found at ${REPO_DIR}. Set repository variable DEPLOY_PATH to the clone path on the target host."
            exit 1
          fi

          cd "${REPO_DIR}"
          git fetch --tags --force origin
          git checkout --detach "${DEPLOY_TAG}"

          curl --fail --show-error --silent --connect-timeout 5 --max-time 10 -X POST http://localhost:9090/-/reload || {
            echo "Prometheus reload failed"
            exit 1
          }

          docker compose kill --signal HUP alloy || {
            echo "Failed to send SIGHUP to Alloy"
            exit 1
          }

          if [ ! -x ./scripts/wait-healthy.sh ]; then
            echo "Missing executable script: ./scripts/wait-healthy.sh"
            exit 1
          fi

          ./scripts/wait-healthy.sh
          REMOTE

      - name: Set deployment summary outputs
        id: summary
        run: |
          echo "deployment_mode=config-reload" >> "$GITHUB_OUTPUT"
          echo "services_action=Prometheus reloaded via /-/reload; Alloy reloaded with SIGHUP" >> "$GITHUB_OUTPUT"
          echo "health_result=passed" >> "$GITHUB_OUTPUT"

      - name: "job-finish"
        if: always()
        run: 'echo "job-finish: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'

  deploy-compose-restart:
    name: Deploy (compose restart)
    needs: [detect-changes, tag-candidate]
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      (
        needs.detect-changes.outputs.compose_changed == 'true' ||
        needs.detect-changes.outputs.non_reloadable_config_changed == 'true'
      )
    runs-on: ubuntu-latest
    environment: compose-restart
    outputs:
      deployment_mode: ${{ steps.summary.outputs.deployment_mode }}
      services_action: ${{ steps.summary.outputs.services_action }}
      health_result: ${{ steps.summary.outputs.health_result }}
    steps:
      - name: "job-start"
        run: 'echo "job-start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'

      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "::error::Missing required secret: DEPLOY_HOST"
            missing=1
          fi
          if [ -z "${DEPLOY_USER}" ]; then
            echo "::error::Missing required secret: DEPLOY_USER"
            missing=1
          fi
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::Missing required secret: DEPLOY_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add deploy host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "${DEPLOY_HOST_KEY}" ]; then
            printf '%s\n' "${DEPLOY_HOST_KEY}" >> ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_HOST_KEY not set; using ssh-keyscan TOFU fallback for ${DEPLOY_HOST}"
            ssh-keyscan -T 10 -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          fi

      - name: Run make up on target host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_TAG: ${{ needs.tag-candidate.outputs.tag }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          case "${REPO_NAME}" in
            ""|.*|*..*|*.|*[!A-Za-z0-9._-]*)
              echo "::error::Unsafe repository name for remote path: ${REPO_NAME}"
              exit 1
              ;;
          esac
          if [ -n "${DEPLOY_PATH}" ]; then
            case "${DEPLOY_PATH}" in
              /*) ;;
              *)
                echo "::error::DEPLOY_PATH must be an absolute path: ${DEPLOY_PATH}"
                exit 1
                ;;
            esac
            case "${DEPLOY_PATH}" in
              *"'"*|*..*|*[!A-Za-z0-9_./-]*)
                echo "::error::Unsafe DEPLOY_PATH value: ${DEPLOY_PATH}"
                exit 1
                ;;
            esac
          fi
          case "${DEPLOY_TAG}" in
            deploy-????????-??????-*) ;;
            *)
              echo "::error::Unexpected DEPLOY_TAG format: ${DEPLOY_TAG}"
              exit 1
              ;;
          esac
          ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "REPO_NAME='${REPO_NAME}' DEPLOY_PATH='${DEPLOY_PATH}' DEPLOY_TAG='${DEPLOY_TAG}' bash -s" <<'REMOTE'
          set -euo pipefail

          REPO_DIR="${DEPLOY_PATH:-$HOME/${REPO_NAME}}"
          case "${REPO_DIR}" in
            ""|*..*)
              echo "Unsafe repository path: ${REPO_DIR}"
              exit 1
              ;;
          esac
          if [[ "${REPO_DIR}" != /* ]]; then
            echo "Repository path must be absolute: ${REPO_DIR}"
            exit 1
          fi

          if [ ! -d "${REPO_DIR}/.git" ]; then
            echo "Repository not found at ${REPO_DIR}. Set repository variable DEPLOY_PATH to the clone path on the target host."
            exit 1
          fi

          cd "${REPO_DIR}"
          git fetch --tags --force origin
          git checkout --detach "${DEPLOY_TAG}"

          make up

          if [ ! -x ./scripts/wait-healthy.sh ]; then
            echo "Missing executable script: ./scripts/wait-healthy.sh"
            exit 1
          fi

          ./scripts/wait-healthy.sh
          REMOTE

      - name: Set deployment summary outputs
        id: summary
        run: |
          echo "deployment_mode=compose-restart" >> "$GITHUB_OUTPUT"
          echo "services_action=Ran make up (check-env + docker compose up -d)" >> "$GITHUB_OUTPUT"
          echo "health_result=passed" >> "$GITHUB_OUTPUT"

      - name: "job-finish"
        if: always()
        run: 'echo "job-finish: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'

  # ─── Post-Deployment Verification ──────────────────────────────────────────
  post-deploy-verify:
    name: "🧪 Post-Deploy Verification"
    needs:
      - detect-changes
      - tag-candidate
      - deploy-config-reload
      - deploy-compose-restart
    if: |
      always() && (
        needs.deploy-config-reload.result == 'success' ||
        needs.deploy-compose-restart.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      health_result: ${{ steps.verify.outputs.health_result }}
    steps:
      - name: "job-start"
        run: 'echo "job-start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'

      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${DEPLOY_HOST}" ]; then echo "::error::Missing DEPLOY_HOST"; missing=1; fi
          if [ -z "${DEPLOY_USER}" ]; then echo "::error::Missing DEPLOY_USER"; missing=1; fi
          if [ -z "${DEPLOY_KEY}" ]; then echo "::error::Missing DEPLOY_KEY"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add deploy host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "${DEPLOY_HOST_KEY}" ]; then
            printf '%s\n' "${DEPLOY_HOST_KEY}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          fi

      - name: Verify services healthy on target host
        id: verify
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "REPO_NAME='${REPO_NAME}' DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'REMOTE'
            set -euo pipefail
            REPO_DIR="${DEPLOY_PATH:-$HOME/${REPO_NAME}}"
            if [ -x "${REPO_DIR}/scripts/wait-healthy.sh" ]; then
              cd "${REPO_DIR}"
              ./scripts/wait-healthy.sh
            else
              # Fallback: basic endpoint checks
              for ep in \
                "http://localhost:9090/-/ready" \
                "http://localhost:3000/api/health" \
                "http://localhost:3200/ready" \
                "http://localhost:3100/ready" \
                "http://localhost:8888/metrics"; do
                curl -sf --connect-timeout 5 --max-time 10 "$ep" > /dev/null 2>&1 || {
                  echo "❌ Health check failed: $ep"
                  exit 1
                }
                echo "✅ $(echo $ep | sed 's|http://localhost:[0-9]*/||')"
              done
            fi
          REMOTE
          echo "health_result=passed" >> "$GITHUB_OUTPUT"
          echo "✅ Post-deployment verification passed"

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag-candidate.outputs.tag }}

      - name: Promote deploy-latest-good
        env:
          DEPLOY_TAG: ${{ needs.tag-candidate.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f deploy-latest-good "${DEPLOY_TAG}"
          git push origin deploy-latest-good --force

      - name: "job-finish"
        if: always()
        run: 'echo "job-finish: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'

  # ─── Rollback on Verification Failure ──────────────────────────────────────
  # Checks out deploy-latest-good on the host — the last candidate tag that
  # actually passed post-deploy-verify. Purely read-only from git's
  # perspective (fetch + checkout, no push, no revert), on the runner or the
  # host, so it is unaffected by main's branch protection (LB-04 redesign,
  # #182).
  rollback:
    name: "🔄 Rollback"
    needs: post-deploy-verify
    if: failure() && needs.post-deploy-verify.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rollback_result: ${{ steps.rollback.outputs.result }}
    steps:
      - name: "job-start"
        run: 'echo "job-start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'

      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${DEPLOY_HOST}" ]; then echo "::error::Missing DEPLOY_HOST"; missing=1; fi
          if [ -z "${DEPLOY_USER}" ]; then echo "::error::Missing DEPLOY_USER"; missing=1; fi
          if [ -z "${DEPLOY_KEY}" ]; then echo "::error::Missing DEPLOY_KEY"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add deploy host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "${DEPLOY_HOST_KEY}" ]; then
            printf '%s\n' "${DEPLOY_HOST_KEY}" >> ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_HOST_KEY not set; using ssh-keyscan TOFU fallback for ${DEPLOY_HOST}"
            ssh-keyscan -T 10 -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          fi

      - name: Roll back to deploy-latest-good on target host
        id: rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          case "${REPO_NAME}" in
            ""|.*|*..*|*.|*[!A-Za-z0-9._-]*)
              echo "::error::Unsafe repository name for remote path: ${REPO_NAME}"
              exit 1
              ;;
          esac
          if [ -n "${DEPLOY_PATH}" ]; then
            case "${DEPLOY_PATH}" in
              /*) ;;
              *)
                echo "::error::DEPLOY_PATH must be an absolute path: ${DEPLOY_PATH}"
                exit 1
                ;;
            esac
            case "${DEPLOY_PATH}" in
              *"'"*|*..*|*[!A-Za-z0-9_./-]*)
                echo "::error::Unsafe DEPLOY_PATH value: ${DEPLOY_PATH}"
                exit 1
                ;;
            esac
          fi
          ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "REPO_NAME='${REPO_NAME}' DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail

          REPO_DIR="${DEPLOY_PATH:-$HOME/${REPO_NAME}}"
          case "${REPO_DIR}" in
            ""|*..*)
              echo "Unsafe repository path: ${REPO_DIR}"
              exit 1
              ;;
          esac
          if [[ "${REPO_DIR}" != /* ]]; then
            echo "Repository path must be absolute: ${REPO_DIR}"
            exit 1
          fi

          if [ ! -d "${REPO_DIR}/.git" ]; then
            echo "Repository not found at ${REPO_DIR}. Set repository variable DEPLOY_PATH to the clone path on the target host."
            exit 1
          fi

          cd "${REPO_DIR}"
          git fetch --tags --force origin
          git checkout --detach deploy-latest-good

          make up

          if [ ! -x ./scripts/wait-healthy.sh ]; then
            echo "Missing executable script: ./scripts/wait-healthy.sh"
            exit 1
          fi

          ./scripts/wait-healthy.sh
          REMOTE
          echo "result=success" >> "$GITHUB_OUTPUT"

      - name: "job-finish"
        if: always()
        run: 'echo "job-finish: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'

  comment-summary:
    name: Post deployment summary
    needs:
      - detect-changes
      - tag-candidate
      - deploy-config-reload
      - deploy-compose-restart
      - post-deploy-verify
      - rollback
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "job-start"
        run: 'echo "job-start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'

      - name: Comment on triggering commit
        uses: actions/github-script@v9
        with:
          script: |
            const acceptanceConclusion = `${{ github.event.workflow_run.conclusion || 'unknown' }}`;
            const acceptanceRunUrl = `${{ github.event.workflow_run.html_url || '' }}`;
            const acceptanceRunNumber = `${{ github.event.workflow_run.run_number || '' }}`;
            const triggerSha = `${{ github.event.workflow_run.head_sha || github.sha }}`;
            const composeMode =
              `${{ needs.deploy-compose-restart.outputs.deployment_mode || '' }}`;
            const configMode =
              `${{ needs.deploy-config-reload.outputs.deployment_mode || '' }}`;
            const mode = composeMode || configMode || 'unknown';
            const composeServices =
              `${{ needs.deploy-compose-restart.outputs.services_action || '' }}`;
            const configServices =
              `${{ needs.deploy-config-reload.outputs.services_action || '' }}`;
            const services = composeServices || configServices || 'n/a';
            const verifyHealth =
              `${{ needs.post-deploy-verify.outputs.health_result || '' }}`;
            const composeHealth =
              `${{ needs.deploy-compose-restart.outputs.health_result || '' }}`;
            const configHealth =
              `${{ needs.deploy-config-reload.outputs.health_result || '' }}`;
            const health = verifyHealth || composeHealth || configHealth || 'failed';
            const composeResult = `${{ needs.deploy-compose-restart.result }}`;
            const configResult = `${{ needs.deploy-config-reload.result }}`;
            const verifyResult = `${{ needs.post-deploy-verify.result }}`;
            const rollbackResult = `${{ needs.rollback.result }}`;
            const deployTag = `${{ needs.tag-candidate.outputs.tag || '' }}` || 'n/a';
            const composeChanged = `${{ needs.detect-changes.outputs.compose_changed }}` === 'true';
            const reloadChanged = `${{ needs.detect-changes.outputs.reload_changed }}` === 'true';
            const nonReloadableChanged = `${{ needs.detect-changes.outputs.non_reloadable_config_changed }}` === 'true';
            const hasDeployableChanges = composeChanged || reloadChanged || nonReloadableChanged;

            let summaryStatus = 'deployed';
            let reason = 'Deployment executed.';
            let deploymentMode = mode;
            let servicesAction = services;
            let healthResult = health;
            let deployTagSummary = deployTag;

            if (acceptanceConclusion !== 'success') {
              summaryStatus = 'skipped';
              reason = `Acceptance Full gate did not pass (\`${acceptanceConclusion}\`).`;
              deploymentMode = 'skipped';
              servicesAction = 'none';
              healthResult = 'not run';
              deployTagSummary = 'n/a (acceptance gate did not pass)';
            } else if (!hasDeployableChanges) {
              summaryStatus = 'skipped';
              reason = 'Acceptance Full passed, but no deployable compose/config/dashboard changes were detected.';
              deploymentMode = 'no-op';
              servicesAction = 'none';
              healthResult = 'not run';
            } else if (composeResult === 'skipped' && configResult === 'skipped') {
              summaryStatus = 'skipped';
              reason = 'Deployable changes were detected, but no deploy job executed.';
              healthResult = 'not run';
            }

            const body = [
              '## GitOps Reconciliation Summary',
              `- Status: ${summaryStatus}`,
              `- Reason: ${reason}`,
              `- Acceptance Full: ${
                acceptanceRunUrl
                  ? `[run #${acceptanceRunNumber}](${acceptanceRunUrl})`
                  : 'n/a'
              } — ${acceptanceConclusion}`,
              `- Deploy tag: ${deployTagSummary}`,
              `- Mode: ${deploymentMode}`,
              `- Services: ${servicesAction}`,
              `- Health check: ${healthResult}`,
              `- Post-deploy verify: ${verifyResult}`,
              `- Rollback: ${rollbackResult}`,
              `- compose-restart job: ${composeResult}`,
              `- config-reload job: ${configResult}`,
              `- Changed paths: compose=${composeChanged}, reload=${reloadChanged}, ` +
                `non_reloadable_config=${nonReloadableChanged}`,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/` +
                `${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: triggerSha,
              body
            });

      - name: "job-finish"
        if: always()
        run: 'echo "job-finish: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'
