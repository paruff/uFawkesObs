name: Release Please

# Automates the release cadence (issue #264): a green "Acceptance Full
# (Post-Merge)" run — the same gate deploy.yml uses — lets release-please
# scan Conventional Commits since the last release and update a standing
# "release PR" with the next version bump + CHANGELOG entry. Nothing is
# actually released until a human merges that PR: this does NOT release on
# every merge, only proposes the next release, batching accumulated commits.

on:
  workflow_run:
    workflows: ["Acceptance Full (Post-Merge)"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: job-start
        run: echo "job-start workflow=release-please job=release-please sha=${{ github.event.workflow_run.head_sha }} time=$(date -u +%FT%TZ)"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main
          # PRs/pushes made with the default GITHUB_TOKEN don't trigger
          # other pull_request-scoped workflows (GitHub's anti-recursion
          # protection) -- confirmed live: the release PR this action
          # creates never gets Pre-commit Hooks/Security/Unit Tests/etc.
          # to run, so it can never satisfy the required-status-checks
          # ruleset and sits permanently unmergeable. A PAT isn't subject
          # to that restriction. Falls back to the default token if the
          # secret isn't set yet, so this doesn't newly break anything --
          # see docs/RELEASE_PROCESS.md for how to create it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Attach source tarball and SHA256 to GitHub Release
        if: ${{ steps.release.outputs.release_created == 'true' && steps.release.outputs.tag_name != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          archive="${TAG}.tar.gz"
          checksum="${archive}.sha256"

          git archive --format=tar.gz --output "${archive}" "${TAG}"
          sha256sum "${archive}" > "${checksum}"
          gh release upload "${TAG}" "${archive}" "${checksum}" --clobber

      - name: job-finish
        if: always()
        run: echo "job-finish workflow=release-please job=release-please sha=${{ github.event.workflow_run.head_sha }} time=$(date -u +%FT%TZ)"
