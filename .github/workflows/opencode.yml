# ============================================================================
# OpenCode Agent CI — Dispatches agent sessions from GitHub Actions
# ============================================================================
# Reference: https://github.com/anomalyco/opencode
#
# Providers (in fallback order — see .opencode/fallback.json, written below,
# for the exact order the opencode-auto-fallback plugin uses at runtime):
#   1. NVIDIA NIM — free models via nim-proxy (rate-limit pacing, multi-key LB)
#   2. Google Gemini — gemini-2.5-flash via GEMINI_API_KEY
#   3. OpenCode free tier — nemotron-3.5-lightning-free via OPENCODE_API_KEY
#
# opencode.json uses the real config schema (provider/model/small_model/agent
# — see https://opencode.ai/config.json). Automatic retry across providers is
# NOT a native opencode.json feature; it comes from the opencode-auto-fallback
# plugin reading .opencode/fallback.json (both written by this workflow).
#
# Required repository secrets:
#   NVIDIA_API_KEY   — single key, OR
#   NVIDIA_API_KEYS  — comma-separated list for load-balancing across keys
#   GEMINI_API_KEY
#   OPENCODE_API_KEY
#
# nim-proxy (https://github.com/paruff/nim-proxy or compatible) runs as a
# Docker container that listens on localhost:8000, paces requests to ≤40 RPM,
# and distributes load across all provided keys.  OpenCode is pointed at the
# proxy so all NVIDIA requests go through it.
#
# This workflow is triggered by:
#   - Issues labeled with `opencode` + sizing labels (maintainer-authored only)
#   - Issue comments containing `/opencode` or `/oc` (from maintainers only)
#   - Manual workflow_dispatch with issue number
# ============================================================================

name: OpenCode

on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
      model:
        description: "Model override"
        required: false
        default: "opencode/claude-opus-4-5"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  opencode:
    # Every path into this job must be gated on author_association, not just
    # on labels. An issue's title and body are attacker-controlled on a public
    # repo, and this job hands them to an agent holding write permissions and
    # repository secrets. The comment body is untrusted input (any user can
    # comment on an issue), so it must never be evaluated as shell code —
    # it is passed to the Run OpenCode step via an env var, not interpolated
    # into the run: script.
    if: |
      github.repository == 'paruff/uFawkesObs' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        (github.event.issue.author_association == 'OWNER' ||
         github.event.issue.author_association == 'MEMBER' ||
         github.event.issue.author_association == 'COLLABORATOR') &&
        contains(github.event.issue.labels.*.name, 'opencode') &&
        (contains(github.event.issue.labels.*.name, 'ready-for-dev') ||
         contains(github.event.issue.labels.*.name, 'good-first-issue') ||
         contains(github.event.issue.labels.*.name, 'feature') ||
         contains(github.event.issue.labels.*.name, 'bug'))) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR') &&
        (startsWith(github.event.comment.body, '/opencode') ||
         startsWith(github.event.comment.body, '/oc'))
       ))
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: "job-start"
        run: 'echo "job-start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # ── 2. Start nim-proxy ───────────────────────────────────────────────────
      # nim-proxy paces NVIDIA NIM requests to stay under the free-tier 40 RPM
      # limit and optionally load-balances across multiple API keys.
      #
      # If neither NVIDIA_API_KEY nor NVIDIA_API_KEYS is set the proxy step
      # is skipped and PROVIDER_ORDER is updated so NVIDIA is tried last (or
      # the fallback runs directly to Gemini / OpenCode Zen).
      - name: Start nim-proxy (NVIDIA NIM rate-limit proxy)
        id: nim_proxy
        continue-on-error: true  # workflow continues even if proxy fails
        env:
          NIM_API_KEYS: ${{ secrets.NVIDIA_API_KEYS || secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "${NIM_API_KEYS}" ]; then
            echo "::warning::No NVIDIA API key found — nim-proxy will NOT start. Falling back to Gemini/OpenCode Zen."
            echo "nim_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker run -d \
            --name nim-proxy \
            --network host \
            -e NIM_API_KEYS="${NIM_API_KEYS}" \
            -e LISTEN_ADDR="0.0.0.0:8000" \
            -e RATE_LIMIT_RPM="40" \
            ghcr.io/paruff/nim-proxy:0.2.0

          # Wait up to 20 s for the proxy to become healthy
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "nim-proxy is healthy after ${i}s"
              echo "nim_available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done

          echo "::warning::nim-proxy did not become healthy in 20 s — falling back to Gemini/OpenCode Zen."
          docker logs nim-proxy || true
          echo "nim_available=false" >> "$GITHUB_OUTPUT"

      # ── 3. Write opencode.json ───────────────────────────────────────────────
      # Writes opencode.json (real schema: provider/model/small_model/agent)
      # plus .opencode/fallback.json (the opencode-auto-fallback plugin's own
      # retry-order file — opencode.json itself has no native fallback field):
      #   - If nim-proxy is up   → primary = NVIDIA via proxy, then Gemini, then OpenCode free tier
      #   - If nim-proxy is down → primary = Gemini, then OpenCode free tier
      # Both files are auto-discovered by OpenCode's config loader from the
      # workspace root / .opencode — there is no --config flag to point at them.
      - name: Write opencode.json
        env:
          NIM_AVAILABLE: ${{ steps.nim_proxy.outputs.nim_available }}
        run: |
          if [ "${NIM_AVAILABLE}" = "true" ]; then
            PRIMARY_MODEL="nvidia-proxy/nvidia/qwen3-coder-480b-a35b-instruct"
            PLAN_MODEL="nvidia-proxy/nvidia/nemotron-3-ultra-550b-a55b"
            FALLBACK_ORDER='[
              "nvidia-proxy/nvidia/qwen3-coder-480b-a35b-instruct",
              "nvidia-proxy/nvidia/nemotron-3-ultra-550b-a55b",
              "google/gemini-2.5-flash",
              "opencode/nemotron-3.5-lightning-free"
            ]'
          else
            PRIMARY_MODEL="google/gemini-2.5-flash"
            PLAN_MODEL="google/gemini-2.5-flash"
            FALLBACK_ORDER='[
              "google/gemini-2.5-flash",
              "opencode/nemotron-3.5-lightning-free"
            ]'
          fi

          mkdir -p .opencode

          cat > opencode.json <<JSONEOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "plugin": ["opencode-auto-fallback"],
            "provider": {
              "nvidia-proxy": {
                "name": "NVIDIA NIM (via nim-proxy)",
                "npm": "@ai-sdk/openai-compatible",
                "options": {
                  "baseURL": "http://localhost:8000/v1",
                  "apiKey": "unused-nim-proxy-handles-auth"
                },
                "models": {
                  "nvidia/qwen3-coder-480b-a35b-instruct": { "name": "Qwen3 Coder 480B (NIM primary)" },
                  "nvidia/nemotron-3-ultra-550b-a55b": { "name": "Nemotron 3 Ultra 550B (NIM secondary)" }
                }
              }
            },
            "model": "${PRIMARY_MODEL}",
            "small_model": "google/gemini-2.5-flash",
            "agent": {
              "plan": { "model": "${PLAN_MODEL}" },
              "build": { "model": "${PRIMARY_MODEL}" },
              "general": { "model": "${PRIMARY_MODEL}" },
              "explore": { "model": "opencode/nemotron-3.5-lightning-free" }
            }
          }
          JSONEOF

          cat > .opencode/fallback.json <<JSONEOF
          {
            "\$schema": "https://raw.githubusercontent.com/HyeokjaeLee/opencode-auto-fallback/main/docs/fallback.schema.json",
            "enabled": true,
            "autoUpdate": false,
            "defaultFallback": ${FALLBACK_ORDER},
            "cooldownMs": 60000,
            "maxRetries": 2,
            "logging": true
          }
          JSONEOF

          echo "opencode.json written:"
          cat opencode.json
          echo ".opencode/fallback.json written:"
          cat .opencode/fallback.json

      # ── 4. Install OpenCode ───────────────────────────────────────────────────
      - name: Install OpenCode CLI
        run: |
          curl -fsSL https://opencode.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ── 5. Run OpenCode ───────────────────────────────────────────────────────
      # For issue triggers: uses the issue body as the prompt
      # For comment triggers: extracts the prompt from the comment (everything
      # after the slash command)
      - name: Run OpenCode
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # Deny shell execution. The agent still edits files and opens PRs;
          # this removes arbitrary command execution from the blast radius of
          # anything that reaches it through an issue or comment body. Lost
          # when opencode.yaml (which had this) was consolidated into this
          # file for #350 — see #357 for the fuller OIDC + egress-policy fix.
          OPENCODE_PERMISSION: '{"bash": "deny"}'
          # Untrusted input: passed via env var, never interpolated into the
          # run: script, so shell metacharacters cannot execute on the runner.
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Determine the prompt source
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            # Comment trigger — strip the trigger command
            PROMPT="${COMMENT#/opencode}"
            PROMPT="${PROMPT#/oc}"
            PROMPT="$(echo "${PROMPT}" | sed 's/^[[:space:]]*//')"
          else
            # Issue or workflow_dispatch — use issue body
            PROMPT="${ISSUE_BODY}"
          fi

          if [ -z "${PROMPT}" ]; then
            echo "::error::No prompt found. Usage: /opencode <your request>"
            exit 1
          fi

          echo "Prompt: ${PROMPT}"

          # opencode.json / .opencode/fallback.json are auto-discovered from
          # the workspace root — this CLI version has no --config flag, and
          # no --issue flag either, so the issue number goes into the title
          # for traceability instead.
          opencode run \
            --title "issue-${ISSUE_NUMBER}" \
            -- "${PROMPT}"

      # ── 6. Tear down nim-proxy ────────────────────────────────────────────────
      - name: Stop nim-proxy
        if: always()
        run: docker rm -f nim-proxy 2>/dev/null || true

      - name: "job-finish"
        if: always()
        run: 'echo "job-finish: $(date -u +%Y-%m-%dT%H:%M:%SZ)"'
