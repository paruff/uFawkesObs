# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  # Bumps the source requirements*.txt files (loose ranges) that the
  # *.lock files (docs/DETERMINISM.md) pin against. The locks are named
  # requirements.lock (no .txt) specifically so Dependabot's pip
  # file-detection doesn't also discover and partially bump them directly
  # -- it did exactly that before this rename (PRs #404/#405/#407/#408),
  # bumping one pinned line in an already-resolved lock and breaking its
  # internal consistency, since a lock needs atomic regeneration via
  # `pip freeze`, not a single-line edit. After a bump here merges, run
  # `make relock` to regenerate the matching lock file.
  - package-ecosystem: "pip"
    directory: "/tests/unit"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/tests/integration"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/tests/acceptance"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/dora/compute"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/dora/ingestion"
    schedule:
      interval: "weekly"
