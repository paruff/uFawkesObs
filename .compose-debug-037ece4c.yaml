name: ufawkesobs-demo-c81269fc
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0@sha256:85ac41c2db88d0df9bd6145e608a3cb023f5d8443868adbfbbf66efb51087917
    restart: unless-stopped
    command:
    - --config=/etc/otel/collector.yaml
    volumes:
    - ./config/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
    - 127.0.0.1:0:4317
    - 127.0.0.1:0:4318
    - 127.0.0.1:0:8888
    - 127.0.0.1:0:8889
    environment:
    - TZ=UTC
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        tag: otel-collector
    labels:
    - plane=obstackd
    - component=otel-collector
    - managed-by=fawkes
    networks:
    - observability
    profiles:
    - core
  tempo:
    image: grafana/tempo:2.10.5@sha256:ee21727732c7a7199cb71c3eee9153bbf23f9b0b87619f0555a0cf21a67f1a33
    restart: unless-stopped
    command:
    - --config.file=/etc/tempo/tempo.yaml
    - --storage.trace.local.path=/var/tempo
    volumes:
    - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    - /tmp/compose-data-d5fvyyim/data/tempo:/var/tempo
    ports:
    - 127.0.0.1:0:3200
    - 127.0.0.1:0:9095
    - 127.0.0.1:0:14250
    - 127.0.0.1:0:14268
    - 127.0.0.1:0:9411
    environment:
    - TZ=UTC
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        tag: tempo
    labels:
    - plane=obstackd
    - component=tracing
    - managed-by=fawkes
    networks:
    - observability
    profiles:
    - core
  loki:
    image: grafana/loki:3.3.2@sha256:8af2de1abbdd7aa92b27c9bcc96f0f4140c9096b507c77921ffddf1c6ad6c48f
    restart: unless-stopped
    command:
    - --config.file=/etc/loki/loki.yaml
    volumes:
    - ./config/loki/loki.yaml:/etc/loki/loki.yaml:ro
    - /tmp/compose-data-q5pgdavi/data/loki:/loki
    ports:
    - 127.0.0.1:0:3100
    - 127.0.0.1:0:9096
    environment:
    - TZ=UTC
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3100/ready
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        tag: loki
    labels:
    - plane=obstackd
    - component=logging
    - managed-by=fawkes
    networks:
    - observability
    profiles:
    - core
  alloy:
    image: grafana/alloy:v1.12.2@sha256:f94b1c82957accb77cd11385fd5e3600758ef1b1ab79557c97319ad28590735a
    restart: unless-stopped
    command:
    - run
    - --server.http.listen-addr=0.0.0.0:12345
    - --storage.path=/var/lib/alloy
    - /etc/alloy/config.river
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./config/alloy/config.river:/etc/alloy/config.river:ro
    - /tmp/compose-data-xe2pobp0/data/alloy:/var/lib/alloy
    ports:
    - 127.0.0.1:0:12345
    environment:
    - TZ=UTC
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - exec 3<>/dev/tcp/127.0.0.1/12345 && exec 3<&-
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        tag: alloy
    labels:
    - plane=obstackd
    - component=collector
    - managed-by=fawkes
    networks:
    - observability
    profiles:
    - core
  prometheus:
    image: prom/prometheus:v3.5.4@sha256:a75c5a35bc21d7afe69551eefa3cb1e1fb1775fe759408007a66b54ec3de1f29
    restart: unless-stopped
    command:
    - --config.file=/etc/prometheus/prometheus.yaml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=30d
    - --web.console.templates=/etc/prometheus/consoles
    - --web.console.libraries=/etc/prometheus/console_libraries
    - --web.enable-lifecycle
    - --web.enable-admin-api
    - --web.enable-remote-write-receiver
    - --web.external-url=http://localhost:9090
    - --log.level=info
    - --log.format=json
    volumes:
    - ./config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    - ./config/prometheus/rules:/etc/prometheus/rules:ro
    - /tmp/compose-data-ituz2g0l/data/prometheus:/prometheus
    ports:
    - 127.0.0.1:0:9090
    environment:
    - TZ=UTC
    depends_on:
    - alertmanager
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:9090/-/healthy
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        tag: prometheus
    labels:
    - plane=obstackd
    - component=metrics
    - managed-by=fawkes
    networks:
    - observability
    profiles:
    - core
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    restart: unless-stopped
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    - --web.external-url=http://localhost:9093
    - --cluster.listen-address=
    - --log.level=info
    - --log.format=json
    volumes:
    - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - /tmp/compose-data-_a2r4mim/data/alertmanager:/alertmanager
    ports:
    - 127.0.0.1:0:9093
    environment:
    - TZ=UTC
    secrets:
    - slack_webhook_url
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:9093/-/healthy
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        tag: alertmanager
    labels:
    - plane=obstackd
    - component=alerting
    - managed-by=fawkes
    networks:
    - observability
    profiles:
    - core
  alertmanager-discord:
    image: rogerrum/alertmanager-discord:1.0.7@sha256:bb4bcb893dacca8735bd634b0796f0a1b3ef05e641f8a7b4921f7d0e5a17ee3e
    restart: unless-stopped
    environment:
    - DISCORD_WEBHOOK=${DISCORD_WEBHOOK_URL:-}
    - DISCORD_USERNAME=ufawkesobs-alerts
    - LISTEN_ADDRESS=0.0.0.0:9094
    - VERBOSE=OFF
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        tag: alertmanager-discord
    labels:
    - plane=obstackd
    - component=alerting
    - managed-by=fawkes
    - profile=notifications
    networks:
    - observability
    profiles:
    - notifications
  grafana:
    image: grafana/grafana:12.3.7@sha256:f02eb8dfe2cd57c1d4cdfaa18394403e2df31e3150efc0fcd7981567958f8364
    restart: unless-stopped
    environment:
    - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
    - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD\
      \ is required \u2014 set it in .env (see .env.example)}"
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    - GF_LOG_MODE=console
    - GF_LOG_FORMAT=json
    - GF_METRICS_ENABLED=true
    - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/platform/ufawkesobs-health.json
    volumes:
    - /tmp/compose-data-zt6b9pr6/data/grafana:/var/lib/grafana
    - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - ./dashboards/platform:/etc/grafana/dashboards/platform:ro
    - ./dashboards/services:/etc/grafana/dashboards/services:ro
    - ./config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
    ports:
    - 127.0.0.1:0:3000
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        tag: grafana
    labels:
    - plane=obstackd
    - component=visualization
    - managed-by=fawkes
    networks:
    - observability
    profiles:
    - core
  telemetry-generator:
    build:
      context: ./apps/telemetry-generator
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
    - 127.0.0.1:0:5000
    environment:
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    - OTEL_SERVICE_NAME=telemetry-generator
    - OTEL_METRIC_EXPORT_INTERVAL=${OTEL_METRIC_EXPORT_INTERVAL:-60000}
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        tag: telemetry-generator
    labels:
    - plane=obstackd
    - component=telemetry-generator
    - managed-by=fawkes
    networks:
    - observability
    profiles:
    - apps
  node-exporter:
    image: prom/node-exporter:v1.8.1@sha256:fa7fa12a57eff607176d5c363d8bb08dfbf636b36ac3cb5613a202f3c61a6631
    restart: unless-stopped
    pid: host
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /:/rootfs:ro
    command:
    - --path.procfs=/host/proc
    - --path.sysfs=/host/sys
    - --path.rootfs=/rootfs
    - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
    - 127.0.0.1:0:9100
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:9100/metrics
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        tag: node-exporter
    labels:
    - plane=obstackd
    - component=node-exporter
    - managed-by=fawkes
    networks:
    - observability
    profiles:
    - core
  dora-api:
    build:
      context: .
      dockerfile: dora/ingestion/Dockerfile
    restart: unless-stopped
    ports:
    - 127.0.0.1:0:8088
    environment:
    - TZ=UTC
    - DATABASE_URL=${DATABASE_URL:-sqlite:////data/dora/dora.db}
    - DORA_API_KEY=${DORA_API_KEY:-}
    - DORA_COMPUTE_WINDOW_DAYS=${DORA_COMPUTE_WINDOW_DAYS:-30}
    - DORA_COMPUTE_INTERVAL_SECONDS=${DORA_COMPUTE_INTERVAL_SECONDS:-3600}
    volumes:
    - ./dora/ingestion:/app/ingestion:ro
    - ./dora/events:/app/events:ro
    - /tmp/compose-data-wchsnjrg/data/dora:/data/dora
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8088/health',
        timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        tag: dora-api
    labels:
    - plane=obstackd
    - component=dora-api
    - managed-by=fawkes
    - profile=dora
    networks:
    - observability
    profiles:
    - dora
secrets:
  slack_webhook_url:
    environment: SLACK_WEBHOOK_URL
networks:
  observability:
    name: observability-lab-f7f9b6c8
    driver: bridge
