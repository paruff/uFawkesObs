# compose.resource-plane.override.yaml
#
# Switches the `dora` profile from its default self-contained SQLite backend
# to the shared uFawkesRes Postgres instance (AGENTS.md §10). Requires
# DORA_POSTGRES_URL in .env (see .env.example) and the `resource-plane`
# profile activated alongside `dora`, so dora-db-init's migration job runs
# before dora-api/dora-compute start.
#
# Compose merges `environment` and `depends_on` by key, so this only swaps
# DATABASE_URL and adds the dora-db-init dependency — every other setting
# (TZ, PUSHGATEWAY_URL, window/interval, pushgateway dependency, etc.) is
# inherited unchanged from compose.yaml.
#
# Usage:
#   docker compose --profile core --profile dora --profile resource-plane \
#     -f compose.yaml -f compose.resource-plane.override.yaml up -d

services:
  dora-api:
    depends_on:
      dora-db-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DORA_POSTGRES_URL:?Set DORA_POSTGRES_URL in .env (see .env.example) — no credential default is provided in compose.yaml}
    networks:
      - fawkes-backbone-net

  dora-compute:
    depends_on:
      dora-db-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DORA_POSTGRES_URL:?Set DORA_POSTGRES_URL in .env (see .env.example) — no credential default is provided in compose.yaml}
    networks:
      - fawkes-backbone-net

  # dora-db-init is defined in the base compose.yaml (gated behind the
  # resource-plane profile there); this override only adds the network it
  # needs to actually reach fawkes-postgres to run migrations against it.
  dora-db-init:
    networks:
      - fawkes-backbone-net

networks:
  # Created by uFawkesRes's own compose stack (name: ufawkes-resources in
  # its compose.yaml), not by uFawkesObs -- external: true, don't try to
  # create it here. Requires uFawkesRes's stack to already be running.
  fawkes-backbone-net:
    external: true
    name: ufawkes-resources_fawkes-backbone-net
